name: Sub-issue Linux CI

on:
  pull_request:
    branches-ignore:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  # 마일스톤 브랜치에 서브이슈가 머지될 때도 돌린다 (#108). 서브이슈 PR의 캐시(Flutter SDK·Gradle·NDK 등)는 그 PR 범위에만
  # 저장되고, 다른 PR은 베이스 브랜치와 main 범위의 캐시만 읽을 수 있다. 여기서 마일스톤 브랜치 범위에 캐시를 만들어 두면
  # 다음 서브이슈 PR들이 처음부터 함께 쓴다(키가 정확히 맞으면 PR 범위에 다시 저장하지도 않는다).
  push:
    branches:
      - 'milestone/**'
  workflow_dispatch:

concurrency:
  group: subissue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-ci:
    name: Linux Analyze, Test & Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      # setup-java는 두지 않고 러너 이미지의 기본 JDK(현재 25, 없어도 된다)를 쓴다 — JDK를 지운 러너로 확인한 기록은 #102.
      # 이 잡에서 JDK를 찾는 곳은 flutter doctor(진단 출력뿐)와 Linux 빌드의 jni FFI 플러그인(shared_preferences_android의
      # 전이 의존성, jni 1.1.2 기준 JDK가 없으면 libdartjni.so만 빼고 빌드 — 앱은 Linux에서 jni를 안 쓴다)뿐이다.
      # Java 버전이 중요한 일은 아래 android-unit-test 잡(Java 21)과 Milestone CI의 build-android 잡이 맡는다.

      # SDK 버전은 pubspec.yaml의 environment.flutter 하나로 고정한다 (#78).
      # 액션의 flutter-version-file은 yq가 필요해(Windows 러너는 매번 Chocolatey로 설치) 스크립트로 직접 읽는다 (#90)
      - name: Read pinned Flutter version
        id: flutter-pin
        shell: bash
        run: bash .github/scripts/read-flutter-version.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-pin.outputs.version }}
          cache: true

      - name: Verify Flutter environment
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test

      - name: Build Linux (Debug)
        run: flutter build linux --debug

      # 개발용 미리보기(#21)의 주 실행 경로(Chrome)가 웹 컴파일되는지 확인한다.
      - name: Build key preview (Web)
        run: flutter build web -t preview/key_preview_main.dart --no-wasm-dry-run

      # pub get·test·build가 추적 파일을 바꾸거나 무시되지 않은 생성물을 남기지 않았는지 확인한다 (#67).
      - name: Verify clean working tree
        run: bash .github/scripts/verify-clean-tree.sh

  # Android 플랫폼 코드(Kotlin)의 JVM 단위 테스트 (#108) — 기기 없이 Robolectric으로 돈다.
  # 이 잡은 Sub-issue CI와 Milestone CI에 같은 내용으로 둔다 (test/unit/ci_android_unit_test_test.dart가 대조한다).
  android-unit-test:
    name: Android Unit Tests (JVM)
    runs-on: ubuntu-latest
    # push는 Sub-issue CI의 마일스톤 브랜치 캐시 예열 실행이다 (Milestone CI에는 push 트리거가 없어 늘 PR 조건만 본다)
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    # 캐시가 맞으면 약 2~3분, 없으면 약 4~12분(내려받기 속도 편차가 크다, #121 실측). 내려받기가 멈춰도 오래 잡히지 않게 한다.
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Robolectric은 API 36 프레임워크를 Java 21 이상에서만 돌린다 (android/app/build.gradle.kts의 minTestJavaVersion)
      - name: Setup Java (Temurin 21)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          # ~/.gradle/caches·wrapper(Gradle 배포본·플러그인·의존성)를 Gradle 설정 파일 해시로 캐시한다
          cache: 'gradle'

      # SDK 버전은 pubspec.yaml의 environment.flutter 하나로 고정한다 (#78).
      # 액션의 flutter-version-file은 yq가 필요해(Windows 러너는 매번 Chocolatey로 설치) 스크립트로 직접 읽는다 (#90)
      - name: Read pinned Flutter version
        id: flutter-pin
        shell: bash
        run: bash .github/scripts/read-flutter-version.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-pin.outputs.version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Gradle 래퍼(android/gradlew)와 android/local.properties는 저장소에 없고 Flutter가 만든다
      - name: Generate Gradle wrapper
        run: flutter build apk --debug --config-only

      # Gradle 구성 단계에서 AGP가 Flutter 기본 NDK를 설치하고(jni 플러그인이 ndkVersion을 지정한다, 내려받기 속도에 따라 14초~3분 25초 — 테스트에는 안 쓴다),
      # Robolectric은 테스트 대상 API 수준의 프레임워크 jar(약 700MB)를 ~/.m2에 받는다. 둘 다 Gradle 캐시 밖이라 따로 캐시한다.
      # 버전을 읽지 못하면(Flutter를 올려 FlutterExtension.kt 형식이 바뀌는 등) 경고만 남기고 캐시 없이 돈다.
      - name: Locate Android test downloads
        id: test-deps
        shell: bash
        run: |
          root=${FLUTTER_ROOT:-$(dirname "$(dirname "$(command -v flutter)")")}
          ndk=$(grep -oP 'val ndkVersion: String = "\K[^"]+' "$root/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt" || true)
          if [ -z "$ndk" ] || [ -z "${ANDROID_HOME:-}" ]; then
            echo "::warning::Flutter 기본 NDK 버전이나 ANDROID_HOME을 읽지 못해 NDK·Robolectric 캐시 없이 돈다"
            exit 0
          fi
          echo "ndk=$ndk" >> "$GITHUB_OUTPUT"
          echo "ndk-path=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_OUTPUT"

      # 키: NDK 버전 + Robolectric 버전이 적힌 build.gradle.kts. 테스트 대상 API 수준을 더하면 그 jar만 더 받는다.
      - name: Cache Android NDK and Robolectric SDK jars
        if: steps.test-deps.outputs.ndk != ''
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.test-deps.outputs.ndk-path }}
            ~/.m2/repository/org/robolectric
          key: android-test-deps-${{ runner.os }}-ndk${{ steps.test-deps.outputs.ndk }}-${{ hashFiles('android/app/build.gradle.kts') }}
          restore-keys: android-test-deps-${{ runner.os }}-ndk${{ steps.test-deps.outputs.ndk }}-

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      # Gradle 테스트가 추적 파일을 바꾸거나 무시되지 않은 생성물을 남기지 않았는지 확인한다 (#67)
      - name: Verify clean working tree
        run: bash .github/scripts/verify-clean-tree.sh
