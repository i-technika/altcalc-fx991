name: Sub-issue Linux CI

on:
  pull_request:
    branches-ignore:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: subissue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-ci:
    name: Linux Analyze, Test & Build
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter environment
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test

      - name: Build Linux (Debug)
        run: flutter build linux --debug

      # 개발용 미리보기(#21)의 주 실행 경로(Chrome)가 웹 컴파일되는지 확인한다.
      - name: Build key preview (Web)
        run: flutter build web -t preview/key_preview_main.dart --no-wasm-dry-run

      # pub get·test·build가 추적 파일을 바꾸거나 무시되지 않은 생성물을 남기지 않았는지 확인한다 (#67).
      # 실패하면 바뀐 생성 파일을 커밋하지 않았거나, 생성 파일 줄바꿈 고정(.gitattributes)이 깨진 것이다.
      - name: Verify clean working tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff --stat
            echo "::error::빌드 뒤 작업 트리가 깨끗하지 않다 (#67). 생성 파일 커밋 누락 또는 줄바꿈 속성을 확인할 것."
            exit 1
          fi
