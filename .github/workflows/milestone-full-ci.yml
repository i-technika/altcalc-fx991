name: Milestone Full Multi-Platform CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: milestone-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality-and-linux:
    name: Code Quality & Linux Build
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      # SDK 버전은 pubspec.yaml의 environment.flutter 하나로 고정한다 (#78).
      # 액션의 flutter-version-file은 yq가 필요해(Windows 러너는 매번 Chocolatey로 설치) 스크립트로 직접 읽는다 (#90)
      - name: Read pinned Flutter version
        id: flutter-pin
        shell: bash
        run: bash .github/scripts/read-flutter-version.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-pin.outputs.version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test

      - name: Build Linux (Release)
        run: flutter build linux --release

      # pub get·test·build 뒤 작업 트리가 깨끗한지 확인한다 (#67, Sub-issue CI와 같은 검사)
      - name: Verify clean working tree
        run: bash .github/scripts/verify-clean-tree.sh

  build-android:
    name: Android Build (APK)
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      # SDK 버전은 pubspec.yaml의 environment.flutter 하나로 고정한다 (#78).
      # 액션의 flutter-version-file은 yq가 필요해(Windows 러너는 매번 Chocolatey로 설치) 스크립트로 직접 읽는다 (#90)
      - name: Read pinned Flutter version
        id: flutter-pin
        shell: bash
        run: bash .github/scripts/read-flutter-version.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-pin.outputs.version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --debug

  # Android 플랫폼 코드(Kotlin)의 JVM 단위 테스트 (#108) — 기기 없이 Robolectric으로 돈다.
  # 이 잡은 Sub-issue CI와 Milestone CI에 같은 내용으로 둔다 (test/unit/ci_android_unit_test_test.dart가 대조한다).
  android-unit-test:
    name: Android Unit Tests (JVM)
    runs-on: ubuntu-latest
    # push는 Sub-issue CI의 마일스톤 브랜치 캐시 예열 실행이다 (Milestone CI에는 push 트리거가 없어 늘 PR 조건만 본다)
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    # 캐시가 맞으면 약 2~3분, Android 쪽 캐시가 없으면 약 4~6분(#121 실측, 캐시 스텝이 없던 #108 초기 구성은 11.5분). 내려받기가 멈춰도 오래 잡히지 않게 한다.
    # Milestone CI(PR → main)는 마일스톤 브랜치 범위의 캐시를 읽지 못해 Ready 뒤 첫 실행은 캐시 없이 돈다 (README "Android 단위 테스트").
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Robolectric은 API 36 프레임워크를 Java 21 이상에서만 돌린다 (android/app/build.gradle.kts의 minTestJavaVersion)
      - name: Setup Java (Temurin 21)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          # ~/.gradle/caches·wrapper(Gradle 배포본·플러그인·의존성)를 Gradle 설정 파일 해시로 캐시한다
          cache: 'gradle'

      # SDK 버전은 pubspec.yaml의 environment.flutter 하나로 고정한다 (#78).
      # 액션의 flutter-version-file은 yq가 필요해(Windows 러너는 매번 Chocolatey로 설치) 스크립트로 직접 읽는다 (#90)
      - name: Read pinned Flutter version
        id: flutter-pin
        shell: bash
        run: bash .github/scripts/read-flutter-version.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-pin.outputs.version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Gradle 래퍼(android/gradlew)와 android/local.properties는 저장소에 없고 Flutter가 만든다
      - name: Generate Gradle wrapper
        run: flutter build apk --debug --config-only

      # Gradle 구성 단계에서 AGP가 Flutter 기본 NDK를 설치하고(jni 플러그인이 ndkVersion을 지정한다, 14초~3.5분 — 테스트에는 안 쓴다),
      # Robolectric은 테스트 대상 API 수준의 프레임워크 jar(약 700MB)를 ~/.m2에 받는다. 둘 다 Gradle 캐시 밖이라 따로 캐시한다.
      # 버전을 읽지 못하면(Flutter를 올려 FlutterExtension.kt 형식이 바뀌는 등) 경고만 남기고 캐시 없이 돈다.
      - name: Locate Android test downloads
        id: test-deps
        shell: bash
        run: |
          root=${FLUTTER_ROOT:-$(dirname "$(dirname "$(command -v flutter)")")}
          ndk=$(grep -oP 'val ndkVersion: String = "\K[^"]+' "$root/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt" || true)
          if [ -z "$ndk" ] || [ -z "${ANDROID_HOME:-}" ]; then
            echo "::warning::Flutter 기본 NDK 버전이나 ANDROID_HOME을 읽지 못해 NDK·Robolectric 캐시 없이 돈다"
            exit 0
          fi
          echo "ndk=$ndk" >> "$GITHUB_OUTPUT"
          echo "ndk-path=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_OUTPUT"

      # 키: NDK 버전 + Robolectric 버전이 적힌 build.gradle.kts. 테스트 대상 API 수준을 더하면 그 jar만 더 받는다.
      - name: Cache Android NDK and Robolectric SDK jars
        if: steps.test-deps.outputs.ndk != ''
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.test-deps.outputs.ndk-path }}
            ~/.m2/repository/org/robolectric
          key: android-test-deps-${{ runner.os }}-ndk${{ steps.test-deps.outputs.ndk }}-${{ hashFiles('android/app/build.gradle.kts') }}
          restore-keys: android-test-deps-${{ runner.os }}-ndk${{ steps.test-deps.outputs.ndk }}-

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      # Gradle 테스트가 추적 파일을 바꾸거나 무시되지 않은 생성물을 남기지 않았는지 확인한다 (#67)
      - name: Verify clean working tree
        run: bash .github/scripts/verify-clean-tree.sh

  build-web:
    name: Web Build
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # SDK 버전은 pubspec.yaml의 environment.flutter 하나로 고정한다 (#78).
      # 액션의 flutter-version-file은 yq가 필요해(Windows 러너는 매번 Chocolatey로 설치) 스크립트로 직접 읽는다 (#90)
      - name: Read pinned Flutter version
        id: flutter-pin
        shell: bash
        run: bash .github/scripts/read-flutter-version.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-pin.outputs.version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      # 개발용 미리보기(#21) 웹 컴파일 확인
      - name: Build key preview (Web)
        run: flutter build web -t preview/key_preview_main.dart --no-wasm-dry-run

  build-windows:
    name: Windows Build
    runs-on: windows-latest
    if: github.event.pull_request.draft == false
    steps:
      # 개발 PC(Git for Windows 기본 선택지)와 같은 줄바꿈으로 체크아웃한다 — 러너 이미지 기본값이 바뀌어도 #67 검사가 유효하게
      - name: Use core.autocrlf=true like Windows dev PCs
        run: git config --global core.autocrlf true

      - name: Checkout repository
        uses: actions/checkout@v7

      # SDK 버전은 pubspec.yaml의 environment.flutter 하나로 고정한다 (#78).
      # 액션의 flutter-version-file은 yq가 필요해(Windows 러너는 매번 Chocolatey로 설치) 스크립트로 직접 읽는다 (#90)
      - name: Read pinned Flutter version
        id: flutter-pin
        shell: bash
        run: bash .github/scripts/read-flutter-version.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-pin.outputs.version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      # 개발 PC와 같은 core.autocrlf=true 체크아웃에서 생성 플러그인 파일 줄바꿈 고정(.gitattributes, #67)이
      # 깨지면 여기서 수정됨으로 드러난다. 체크아웃 전에 설정을 고정했는지도 확인한다.
      - name: Verify clean working tree
        shell: bash
        run: |
          test "$(git config --get core.autocrlf)" = true || { echo "::error::core.autocrlf=true가 아니라 #67 회귀를 검사할 수 없다"; exit 1; }
          bash .github/scripts/verify-clean-tree.sh

  build-macos-and-ios:
    name: macOS & iOS Build
    runs-on: macos-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # SDK 버전은 pubspec.yaml의 environment.flutter 하나로 고정한다 (#78).
      # 액션의 flutter-version-file은 yq가 필요해(Windows 러너는 매번 Chocolatey로 설치) 스크립트로 직접 읽는다 (#90)
      - name: Read pinned Flutter version
        id: flutter-pin
        shell: bash
        run: bash .github/scripts/read-flutter-version.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-pin.outputs.version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Build iOS (Simulator/No CodeSign)
        run: flutter build ios --no-codesign

      # macOS·iOS 빌드는 Xcode 프로젝트·xcconfig 같은 다른 파일을 정당하게 바꿀 수 있으므로,
      # Flutter가 다시 쓰는 생성 플러그인 파일만 검사한다 (#67)
      - name: Verify generated plugin files unchanged
        run: bash .github/scripts/verify-clean-tree.sh linux/flutter windows/flutter macos/Flutter/GeneratedPluginRegistrant.swift
